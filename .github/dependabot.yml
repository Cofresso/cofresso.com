version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      next:
        patterns: ['next', 'react', 'react-dom', '@types/react', '@types/react-dom', 'eslint-config-next']
      drizzle:
        patterns: ['drizzle-*']
      testing:
        patterns: ['vitest', '@vitest/*', '@playwright/test', '@testing-library/*', 'jsdom']
      lint:
        patterns: ['eslint*', 'prettier*', '@typescript-eslint/*', 'typescript']
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: 'chore(deps)'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'ci'
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'build'
  - package-ecosystem: terraform
    directory: /infra
    schedule:
      interval: weekly
    commit-message:
      prefix: 'infra'
