name: Infrastructure

on:
  pull_request:
    paths: ['infra/**', '.github/workflows/infra.yml']
  push:
    branches: [main]
    paths: ['infra/**', '.github/workflows/infra.yml']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: infra

env:
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'

jobs:
  validate:
    name: terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive -diff
      - run: terraform init -backend=false
      - run: terraform validate

  plan:
    name: terraform plan
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_PLANNER_SA }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - run: terraform init
      - id: plan
        run: |
          set +e
          terraform plan -no-color -lock=false -out=tfplan > plan.txt 2>&1
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          set -e
          { echo '### Terraform plan'; echo; echo '```hcl'; head -c 60000 plan.txt; echo; echo '```'; } > plan-trimmed.txt
      - uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: terraform
          path: infra/plan-trimmed.txt
      - name: Fail if the plan errored
        env:
          PLAN_EXIT: ${{ steps.plan.outputs.exit }}
        run: exit "$PLAN_EXIT"

  apply:
    name: terraform apply
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment: infrastructure
    concurrency:
      group: terraform-apply
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_APPLIER_SA }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - run: terraform init
      - run: terraform apply -auto-approve -no-color
