name: Bug report
description: Something on cofresso.com is broken
labels: [bug]
body:
  - type: input
    id: url
    attributes:
      label: URL
      placeholder: https://cofresso.com/products/morning-frame
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true
  - type: input
    id: order
    attributes:
      label: Order number (if relevant)
      placeholder: CF-10001
